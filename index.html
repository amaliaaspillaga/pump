<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pump. — suplementos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4efe8;--tx:#1d1b19;--mut:#8a8379;--bd:#ddd5c9;--box:#fbf8f3;--ink:#1d1b19;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151412;--tx:#f3eee7;--mut:#9b948a;--bd:#2d2a26;--box:#1c1a17}}
:root[data-theme="dark"]{--bg:#151412;--tx:#f3eee7;--mut:#9b948a;--bd:#2d2a26;--box:#1c1a17}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{font-size:28px;font-style:italic;cursor:pointer;letter-spacing:-.5px}
button{font:inherit;cursor:pointer;border:0;border-radius:99px;transition:transform .15s,opacity .15s}
button:active{transform:scale(.95)}
.btn{background:var(--tx);color:var(--bg);padding:12px 22px;font-weight:500}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.5}
.cartbtn{background:transparent;color:var(--tx);border:1px solid var(--tx);padding:7px 16px;font-weight:500}
.badge{background:#a9bf93;color:#1d1b19;border-radius:99px;padding:0 8px;font-size:13px;margin-left:6px;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:8px 18px 18px}
.hero{position:relative;padding:34px 4px 24px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(40px);z-index:-1;opacity:.75}
.hero:before{width:200px;height:200px;background:#d6dccf;right:0;top:0}
.hero:after{width:150px;height:150px;background:#dcd0c6;right:90px;top:90px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.hero h1{margin:8px 0 14px;font-size:clamp(48px,12vw,96px);line-height:.95;letter-spacing:-2px}
.hero h1 em{color:#6f8a5b}
.hero p{max-width:340px;color:var(--mut);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--bd);border-radius:99px;padding:5px 13px;font-size:13px}
.mq{overflow:hidden;white-space:nowrap;border-block:1px solid var(--bd);margin:6px 0 26px;color:var(--mut);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.mq div{display:inline-block;padding:11px 0;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
h2.t{font-size:34px;margin:0 0 14px;letter-spacing:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{border-radius:30px;padding:12px 12px 16px;color:#1d1b19;display:flex;flex-direction:column;gap:2px;transition:transform .25s}
.card:hover{transform:translateY(-5px)}
.pic{position:relative;border-radius:22px;background:#fff;aspect-ratio:1/1;overflow:hidden}
.pic img,.th img{width:100%;height:100%;object-fit:contain;display:block}
.tag{position:absolute;left:10px;top:10px;background:#1d1b19;color:#fff;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:99px}
.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;margin:12px 6px 0}
.card h3{margin:0 6px;font-size:23px;line-height:1.1;text-transform:lowercase}
.card p{margin:2px 6px 8px;font-size:14px;opacity:.7}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 6px}
.price{font-size:22px}
.add{width:42px;height:42px;background:#1d1b19;color:#fff;font-size:22px;line-height:1;padding:0}
.box{background:var(--box);border:1px solid var(--bd);border-radius:28px;padding:18px;margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}.item .n{flex:1;line-height:1.25}.mut{color:var(--mut);font-size:14px}
.th{width:58px;height:58px;border-radius:16px;background:#fff;overflow:hidden;flex:none}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;background:transparent;color:var(--tx);border:1px solid var(--bd)}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .t{font-size:24px;font-family:"DM Serif Display",Georgia,serif;border-top:1px dashed var(--bd);margin-top:6px;padding-top:8px}
label{display:block;font-size:13px;letter-spacing:.04em;font-weight:500;margin:12px 0 5px;color:var(--mut)}
input{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:2px solid #6f8a5b;border-color:transparent}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pay label{margin:0;border:1px solid var(--bd);border-radius:16px;padding:11px;display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--tx);letter-spacing:0}
.pay input{width:auto}
.err{color:#d5476b;font-size:14px;margin-top:6px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.two{grid-template-columns:1.4fr 1fr}}
.done{text-align:center;padding:34px 16px}.done .big{font-size:56px}
.steps{display:flex;gap:6px;margin:10px 0 16px;font-size:13px;color:var(--mut)}
.steps b{color:var(--tx);border-bottom:2px solid #6f8a5b}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--mut);text-align:center;margin:26px 0 80px}
.bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;z-index:6;display:flex;justify-content:space-between;align-items:center;background:var(--tx);color:var(--bg);padding:8px 8px 8px 20px;border-radius:99px;font-size:15px}
.bar .btn{background:var(--bg);color:var(--tx);padding:9px 18px}
</style>
</head>
<body>
<header>
  <div class="logo serif" onclick="go('shop')">pump.</div>
  <button class="cartbtn" onclick="go('cart')">bolsa<span class="badge" id="cnt">0</span></button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

{id:3,n:"hydration multiplier",b:"liquid i.v.",d:"limón-lima · caja x10 sticks",p:45,c:"#e4dfcb",tag:"nuevo"},
{id:4,n:"go energy + electrolyte",b:"science in sport",d:"frambuesa · gel 60 ml",p:12,c:"#dcd0c6",tag:"runners"},
{id:5,n:"cookie dough bar",b:"fit-rex",d:"22 g proteína · 190 kcal",p:7.8,c:"#d9d9d3",tag:"snack"}];
var cart={},view="shop",err="",order=null,form={name:"",phone:"",addr:"",dist:"",pay:"card"};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function m(n){return "S/ "+n.toFixed(2)}
function img(x){return '<img src="'+IM[x.id-1]+'" alt="'+x.n+'">'}
function count(){var c=0;for(var k in cart)c+=cart[k];return c}
function sub(){var s=0;P.forEach(function(x){s+=(cart[x.id]||0)*x.p});return s}
function ship(){var s=sub();return s===0||s>=200?0:10}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1300)}
function add(id){cart[id]=(cart[id]||0)+1;toast("añadido a tu bolsa ✓");draw()}
function chg(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];draw()}
function go(v){err="";view=v;draw();window.scrollTo(0,0)}
function saveForm(){["name","phone","addr","dist"].forEach(function(k){var e=$("f_"+k);if(e)form[k]=e.value});var r=document.querySelector('input[name=pay]:checked');if(r)form.pay=r.value}
function totals(){return '<div class="tot"><div><span>Subtotal</span><span>'+m(sub())+'</span></div><div><span>Envío</span><span>'+(ship()?m(ship()):"gratis ✦")+'</span></div><div class="t"><span>Total</span><span>'+m(sub()+ship())+'</span></div></div>'}
function items(ctl){var h="";P.forEach(function(x){var q=cart[x.id];if(!q)return;h+='<div class="item"><div class="th">'+img(x)+'</div><div class="n"><b>'+x.n+'</b><div class="mut">'+x.b+' · '+m(x.p)+'</div></div>'+(ctl?'<div class="qty"><button onclick="chg('+x.id+',-1)">−</button><b>'+q+'</b><button onclick="chg('+x.id+',1)">+</button></div>':'<b>x'+q+'</b>')+'</div>'});return h}
function shop(){var mq="envío gratis desde S/ 200 ✦ productos 100% originales ✦ paga con yape o plin ✦ entrega en 24–48 h ✦ ";
var h='<div class="hero"><div class="eyebrow">suplementos · lima, perú</div><h1 class="serif">fuel the<br><em>grind.</em></h1><p>Todo lo que necesitas antes, durante y después de entrenar.</p><div class="chips"><span class="chip">original ✓</span><span class="chip">yape / plin</span><span class="chip">envío rápido</span></div><button class="btn" onclick="document.getElementById(\'cat\').scrollIntoView({behavior:\'smooth\'})">ver colección ↓</button></div><div class="mq"><div>'+mq+mq+mq+mq+'</div></div><h2 class="t serif" id="cat">la colección</h2><div class="grid">';
P.forEach(function(x){h+='<div class="card" style="background:'+x.c+'"><div class="pic"><span class="tag">'+x.tag+'</span>'+img(x)+'</div><div class="brand">'+x.b+'</div><h3 class="serif">'+x.n+'</h3><p>'+x.d+'</p><div class="row"><span class="price serif">'+m(x.p)+'</span><button class="add" onclick="add('+x.id+')" aria-label="añadir">+</button></div></div>'});
h+='</div><p class="note">tienda de demostración · no se realizan cobros reales</p>';
if(count())h+='<div class="bar"><span>'+count()+' en tu bolsa · '+m(sub())+'</span><button class="btn" onclick="go(\'cart\')">ver bolsa</button></div>';
return h}
function cartV(){if(!count())return '<div class="box done"><div class="big">🛍️</div><h2 class="serif">tu bolsa está vacía</h2><button class="btn" onclick="go(\'shop\')">ver colección</button></div>';
return '<div class="steps"><b>1 bolsa</b> › 2 pago › 3 listo</div><div class="two"><div class="box">'+items(true)+'</div><div><div class="box">'+totals()+'</div><button class="btn" style="width:100%" onclick="go(\'checkout\')">continuar</button><button class="btn sec" style="width:100%;margin-top:8px" onclick="go(\'shop\')">seguir comprando</button></div></div>'}
function checkout(){if(!count())return cartV();
var pays=[["card","💳 tarjeta"],["yape","📱 yape / plin"],["cash","💵 contra entrega"]];
var ph='<div class="pay">'+pays.map(function(p){return '<label><input type="radio" name="pay" value="'+p[0]+'"'+(form.pay===p[0]?" checked":"")+' onchange="saveForm();draw()">'+p[1]+'</label>'}).join("")+'</div>';
var ex="";
if(form.pay==="card")ex='<label>Número de tarjeta (simulado)</label><input id="f_card" inputmode="numeric" maxlength="19" placeholder="4111 1111 1111 1111"><div style="display:flex;gap:10px"><div style="flex:1"><label>Vence</label><input id="f_exp" placeholder="MM/AA" maxlength="5"></div><div style="flex:1"><label>CVV</label><input id="f_cvv" inputmode="numeric" maxlength="3" placeholder="123"></div></div>';
else if(form.pay==="yape")ex='<label>Celular de Yape / Plin</label><input id="f_yape" inputmode="numeric" maxlength="9" placeholder="987654321">';
else ex='<p class="mut" style="margin-top:10px">Pagas en efectivo al recibir tu pedido.</p>';
return '<div class="steps">1 bolsa › <b>2 pago</b> › 3 listo</div><div class="two"><div><div class="box"><h3 class="serif" style="margin:0;font-size:24px">datos de entrega</h3><label>Nombre completo</label><input id="f_name" value="'+esc(form.name)+'" autocomplete="name"><label>Celular</label><input id="f_phone" inputmode="numeric" maxlength="9" value="'+esc(form.phone)+'" autocomplete="tel"><label>Dirección</label><input id="f_addr" value="'+esc(form.addr)+'" autocomplete="street-address"><label>Distrito</label><input id="f_dist" value="'+esc(form.dist)+'"></div><div class="box"><h3 class="serif" style="margin:0 0 10px;font-size:24px">método de pago</h3>'+ph+ex+'</div></div><div><div class="box"><h3 class="serif" style="margin:0;font-size:24px">tu pedido</h3>'+items(false)+totals()+'</div>'+(err?'<div class="err">'+err+'</div>':'')+'<button class="btn" style="width:100%;margin-top:8px" id="pb" onclick="pay()">pagar '+m(sub()+ship())+'</button><button class="btn sec" style="width:100%;margin-top:8px" onclick="saveForm();go(\'cart\')">volver a la bolsa</button></div></div>'}
function pay(){saveForm();var v=function(i){var e=$(i);return e?e.value.trim():""};
if(!form.name||!/^9\d{8}$/.test(form.phone)||!form.addr||!form.dist){err="Completa tus datos. El celular debe tener 9 dígitos y empezar con 9.";draw();return}
if(form.pay==="card"&&(v("f_card").replace(/\s/g,"").length<13||!/^\d\d\/\d\d$/.test(v("f_exp"))||!/^\d{3}$/.test(v("f_cvv")))){err="Revisa la tarjeta (simulada: cualquier número de 13+ dígitos).";draw();return}
if(form.pay==="yape"&&!/^9\d{8}$/.test(v("f_yape"))){err="Ingresa un celular válido de Yape / Plin.";draw();return}
var b=$("pb");b.disabled=true;b.textContent="procesando pago…";
setTimeout(function(){order={no:"PUMP-"+Math.floor(100000+Math.random()*900000),items:items(false),tot:totals(),f:JSON.parse(JSON.stringify(form))};cart={};err="";view="done";draw();window.scrollTo(0,0)},1600)}
function done(){var pn={card:"Tarjeta",yape:"Yape / Plin",cash:"Contra entrega"}[order.f.pay];
return '<div class="steps">1 bolsa › 2 pago › <b>3 listo</b></div><div class="box done"><div class="big">🤍</div><h2 class="serif" style="font-size:34px;margin:6px 0">pedido confirmado</h2><p>N.º de pedido: <b>'+order.no+'</b></p><p class="mut">Llega en 24–48 h a<br><b>'+esc(order.f.addr)+', '+esc(order.f.dist)+'</b></p><p class="mut">Pago: '+pn+' · '+esc(order.f.name)+'</p></div><div class="box"><h3 class="serif" style="margin:0;font-size:24px">resumen</h3>'+order.items+order.tot+'</div><button class="btn" style="width:100%" onclick="go(\'shop\')">volver a la tienda</button>'}
function draw(){$("cnt").textContent=count();$("app").innerHTML=view==="shop"?shop():view==="cart"?cartV():view==="checkout"?checkout():done()}
draw();
</script>
</body>
</html>
